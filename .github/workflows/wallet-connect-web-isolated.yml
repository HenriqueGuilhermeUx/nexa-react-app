name: Nexa Wallet Connect isolated web checks
on:
  push:
    branches:
      - feat/nexa-walletconnect-br-global-isolated
    paths:
      - 'src/ExternalWalletConnect.jsx'
      - 'src/QaInjectedWalletApp.jsx'
      - 'qa-entry.html'
      - 'src/qa-main.jsx'
      - 'vite.walletconnect-qa.config.js'
      - 'scripts/build-walletconnect-qa.mjs'
      - 'scripts/run-checked-build.mjs'
      - 'package.json'
      - 'src/walletConnectInjected.mjs'
      - 'src/main.jsx'
      - 'scripts/wallet-connect-injected.test.mjs'
      - 'src/walletConnectChallenge.mjs'
      - 'scripts/wallet-connect-challenge.test.mjs'
      - 'src/App.jsx'
      - 'src/styles.css'
      - 'scripts/validate-wallet-connect-isolated.mjs'
      - '.github/workflows/wallet-connect-web-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallet-connect-web-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: https://nexa-walletconnect-qa-api.onrender.com/api/v1
      VITE_PRIVY_APP_ID: qa-injected-does-not-use-privy
      VITE_PRIVY_CLIENT_ID: client-web-ci-placeholder
      VITE_WALLET_CONNECT_LAB_ENABLED: 'true'
      VITE_WALLET_CONNECT_QA_INJECTED: 'true'
      VITE_WALLET_CONNECT_BR_TRUSTED_DOMAIN: nexa-walletconnect-qa-web.onrender.com
      VITE_WALLET_CONNECT_GLOBAL_TRUSTED_DOMAIN: nexa-walletconnect-qa-web.onrender.com
      VITE_WALLET_CONNECT_LAB_API_URL: https://nexa-walletconnect-qa-api.onrender.com/api/v1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20.20.2'}
      - name: Install exact app dependency versions
        run: npm install --no-audit --no-fund
      - name: Verify existing wallet and redemption contract
        run: npm run validate:contract
      - name: Reject unsafe or missing Wallet Connect flows
        run: |
          node scripts/wallet-connect-challenge.test.mjs
          node scripts/wallet-connect-injected.test.mjs
          node scripts/validate-wallet-connect-isolated.mjs
      - name: Build minimal QA portal with no production wallet assets
        run: npm run check
      - name: Verify compiled app
        run: |
          test -s dist/index.html
          test -d dist/assets
          ! grep -R -E 'PRIVY_APP_SECRET|PRIVY_SECRET_KEY|seedPhrase' dist
          grep -R -q 'LABORATÓRIO NÃO FINANCEIRO' dist/assets
          grep -q 'Homologação isolada' dist/index.html
          test ! -f dist/qa-entry.html
          ! grep -R -E 'cmpen2gm3007v0cjswjlyefji|nexa-backend-p2u0.onrender.com|eth_sendTransaction|wallet_sendCalls|wallet_requestPermissions' dist/assets
