name: Nexa portal onboarding & opt-in visibility
on:
  push:
    branches: [feat/nexa-portal-show-onboarding-journey-optin-20261116]
  pull_request:
    paths:
      - src/App.jsx
      - .github/workflows/nexa-onboarding-optin-visibility.yml
permissions:
  contents: read
jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure all other frontend modules are unchanged
        run: |
          node - <<'NODE'
          const cp=require('node:child_process'),assert=require('node:assert/strict'),fs=require('node:fs');
          const files=cp.execFileSync('git',['diff','--name-only','origin/main...HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          // Keep the onboarding contract strict, but permit the exact Aave
          // pilot files in the separate Aave PR. No unrelated modules allowed.
          const onboardingAllowed=['src/App.jsx','package.json',
            '.github/workflows/nexa-onboarding-optin-visibility.yml'];
          const aaveAllowed=[
            'src/AaveRealWallet.jsx','src/aavePilotWallet.js',
            'scripts/validate-aave-pwa-pilot.mjs',
            '.github/workflows/aave-pwa-user-wallet-pilot-qa.yml',
            '.github/workflows/nexa-onboarding-optin-visibility.yml',
          ];
          const aavePilot=files.includes('src/AaveRealWallet.jsx');
          const allowed=aavePilot ? [...onboardingAllowed,...aaveAllowed] : onboardingAllowed;
          assert.deepEqual(files.filter(f=>!allowed.includes(f)),[]);
          if (aavePilot) {
            // Onboarding remains unchanged and only the separately gated
            // Aave module is added; do not weaken KYC or opt-in requirements.
            for (const filename of aaveAllowed.slice(0,4)) {
              assert(files.includes(filename),'Incomplete Aave pilot PR: '+filename);
            }
            const aave=fs.readFileSync('src/AaveRealWallet.jsx','utf8');
            assert(aave.includes('status?.pilotEnabled'));
            assert(aave.includes('riskAcknowledged:true'));
            assert(aave.includes('getAavePilotReceipt'));
          }
          const ui=fs.readFileSync('src/App.jsx','utf8');
          const manifest=JSON.parse(fs.readFileSync('package.json','utf8'));
          const old=JSON.parse(cp.execFileSync('git',['show','origin/main:package.json'],{encoding:'utf8'}));
          assert.equal(manifest.dependencies['@solana-program/system'],'0.8.0');
          assert.equal(manifest.dependencies['@solana-program/token'],'0.6.0');
          if (aavePilot) {
            // On this Aave-only PR the exact current main manifest is the
            // baseline; both Solana compatibility dependencies already exist.
            // Do not remove or alter any existing package.
            assert.deepEqual(manifest,old,'Aave PR must preserve every existing dependency');
          } else {
            delete manifest.dependencies['@solana-program/system'];
            delete manifest.dependencies['@solana-program/token'];
            assert.deepEqual(manifest,old,'Privy, React and build dependencies must remain unchanged');
          }
          assert(ui.includes('<details open className="hero-card"'));
          assert(ui.includes('<NexaLifecycleCoach accessToken={session?.accessToken} apiBaseUrl={API_URL}/>'));
          const coach=fs.readFileSync('src/NexaLifecycleCoach.jsx','utf8');
          assert(coach.includes("educationalEmailOptIn:nextValue"));
          assert(coach.includes("onChange={(event)=>setEducationOptIn(event.target.checked)}"));
          NODE
      - run: npm install --no-audit --no-fund
      - name: Validate existing Privy and all web content
        run: npm run check
      - name: No automated email or user consent change
        run: |
          echo 'UI only: opt-in remains off until explicit action, no background campaign sends'
