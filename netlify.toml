[build]
  command = "npm install --no-audit --no-fund && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.4"
  NPM_FLAGS = "--no-audit --no-fund"

# Proxies operacionais existentes. As regras específicas devem vir antes do SPA.
[[redirects]]
  from = "/admin"
  to = "https://nexa-backend-p2u0.onrender.com/api/v1/admin/portal"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "https://nexa-backend-p2u0.onrender.com/api/v1/admin/portal"
  status = 200
  force = true

[[redirects]]
  from = "/api/v1/*"
  to = "https://nexa-backend-p2u0.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/docs"
  to = "https://nexa-backend-p2u0.onrender.com/docs"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
